name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux / Python 3.10
            os: ubuntu-latest
            python: "3.10"
            cpu_index: true
          - label: Linux / Python 3.13
            os: ubuntu-latest
            python: "3.13"
            cpu_index: true
          - label: Windows / Python 3.12
            os: windows-latest
            python: "3.12"
            cpu_index: true
          - label: macOS / Python 3.12
            os: macos-14
            python: "3.12"
            cpu_index: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install CPU PyTorch
        if: matrix.cpu_index == true
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install macOS PyTorch
        if: matrix.cpu_index == false
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch
      - name: Install ComfyUI and node dependencies
        run: |
          git clone --depth 1 https://github.com/Comfy-Org/ComfyUI.git ../ComfyUI
          python -m pip install pytest packaging
          python -m pip install -r ../ComfyUI/requirements.txt -r requirements.txt
      - name: Test
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q .
