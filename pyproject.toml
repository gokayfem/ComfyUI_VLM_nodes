[project]
name = "comfyui_vlm_nodes"
version = "2.0.1"
description = "Production-ready local and API vision-language nodes for ComfyUI"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "accelerate>=1.0",
  "bitsandbytes>=0.46",
  "diffusers>=0.34,<1",
  "einops>=0.7",
  "huggingface-hub>=0.34,<2",
  "num2words>=0.5.14",
  "openai>=1.30,<3",
  "pydantic>=2.7,<3",
  "qwen-vl-utils>=0.0.14",
  "safetensors>=0.4",
  "soundfile>=0.12",
  "symusic>=0.5",
  "transformers>=5.4,<6",
]

[project.urls]
Repository = "https://github.com/gokayfem/ComfyUI_VLM_nodes"
Issues = "https://github.com/gokayfem/ComfyUI_VLM_nodes/issues"

[tool.comfy]
PublisherId = "gokayfem"
DisplayName = "ComfyUI VLM Nodes"
Icon = ""
